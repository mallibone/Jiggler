name: deploy-web

# Deploys web/ (the static keep-awake page) to Azure Static Web Apps.
# One-time setup: create a Free-tier Static Web App in Azure (deployment
# source "Other"), then store its deployment token as the repo secret
# AZURE_STATIC_WEB_APPS_API_TOKEN — see the README's "Web page" section.
on:
  push:
    branches: [ main ]
    paths: [ 'web/**' ]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          output_location: ''
          skip_app_build: true
