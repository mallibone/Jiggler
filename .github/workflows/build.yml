name: build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: src/MouseJiggler/MouseJiggler.csproj
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # macOS head (net10.0-macos, maui-labs AppKit backend) -> Mouse Jiggler.app
  # PRs build ad-hoc/unsigned (no secrets needed). Pushes to main sign +
  # notarize + staple with the real Developer ID certificate.
  # ---------------------------------------------------------------------------
  build-macos:
    # macos-26 ships Xcode 26.5 (the default), which the net10.0-macos workload
    # requires; macos-15 only has Xcode 16.x and fails the SDK's Xcode check.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install workloads
        run: dotnet workload install macos maui

      - name: Restore
        run: dotnet restore "$PROJECT"

      # ---- Pull-request: verify-only, ad-hoc signed (no secrets) -------------
      - name: Publish (PR, ad-hoc)
        if: github.event_name == 'pull_request'
        run: dotnet publish "$PROJECT" -c Release -f net10.0-macos -p:CodesignKey=""

      # ---- Push / manual: signed + notarized with the real cert --------------
      - name: Import signing certificate
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Publish (signed)
        if: github.event_name != 'pull_request'
        run: dotnet publish "$PROJECT" -c Release -f net10.0-macos -p:CodesignKey="${{ secrets.APPLE_SIGNING_IDENTITY }}"

      - name: Locate .app bundle
        id: app
        run: |
          set -euo pipefail
          APP=$(find src/MouseJiggler/bin/Release/net10.0-macos -maxdepth 3 -name "*.app" -type d | head -n1)
          test -n "$APP" || { echo "No .app bundle found"; exit 1; }
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      # Notarization requires the hardened runtime; the App-Store sandbox build
      # does not enable it, so re-sign the bundle (and its nested binaries) with
      # --options runtime before submitting.
      - name: Re-sign with hardened runtime
        if: github.event_name != 'pull_request'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          ENTITLEMENTS="src/MouseJiggler/Platforms/MacOS/Entitlements.plist"
          # Sign nested Mach-O binaries first (inside-out), then the bundle.
          find "$APP/Contents" -type f \( -name "*.dylib" -o -perm -111 \) | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$f"
            fi
          done
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Zip app bundle
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" MouseJiggler-macos-arm64.zip

      - name: Notarize and staple
        if: github.event_name != 'pull_request'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit MouseJiggler-macos-arm64.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "${{ steps.app.outputs.path }}"
          # Re-zip so the stapled ticket ships inside the downloadable artifact.
          rm -f MouseJiggler-macos-arm64.zip
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" MouseJiggler-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-macos-arm64
          path: MouseJiggler-macos-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows head (net10.0-windows, maui-labs WPF backend) -> single self-
  # contained MouseJiggler.exe (win-x64). Settings baked into the csproj.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install workloads
        run: dotnet workload install maui

      - name: Publish
        # Narrow TargetFrameworks to the Windows TFM only: otherwise the workload
        # resolver inspects the project's full TargetFrameworks (which includes
        # net10.0-macos) and demands the macos workload on the Windows runner.
        run: dotnet publish "${{ env.PROJECT }}" -c Release -f net10.0-windows -p:TargetFrameworks=net10.0-windows

      - name: Stage exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter MouseJiggler.exe `
            -Path src/MouseJiggler/bin/Release/net10.0-windows | Select-Object -First 1
          if (-not $exe) { throw "MouseJiggler.exe not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/MouseJiggler-win-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MouseJiggler-win-x64
          path: dist/MouseJiggler-win-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a rolling "latest" GitHub Release (push to main only).
  # ---------------------------------------------------------------------------
  release:
    if: github.event_name == 'push'
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Roll the 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automated build from main @ ${GITHUB_SHA:0:7}" \
            --latest
